name: GreenCredit .exe

on:
  push:
    paths:
      - "yashil_kredit/**"
      - ".github/workflows/build-greencredit-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: yashil_kredit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build GreenCredit.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name GreenCredit --collect-submodules reportlab run_app.py

      - uses: actions/upload-artifact@v4
        with:
          name: GreenCredit-windows
          path: yashil_kredit/dist/GreenCredit.exe
