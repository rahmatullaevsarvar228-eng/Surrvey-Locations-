name: Windows build — AnketaQC

on:
  push:
    paths:
      - "qc_app/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: qc_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q tests

      - name: Build exe
        run: pyinstaller packaging/anketa_qc.spec --noconfirm --distpath dist --workpath build

      - name: Add .NET config next to exe
        shell: pwsh
        run: Copy-Item packaging\AnketaQC.exe.config dist\AnketaQC\AnketaQC.exe.config

      - name: Smoke test as if downloaded from the internet
        shell: pwsh
        run: |
          # Ставим на все файлы пометку «скачано из интернета», как Windows делает
          # при распаковке скачанного zip, — именно так падал запуск у пользователя.
          $zone = "[ZoneTransfer]`r`nZoneId=3"
          $files = Get-ChildItem dist\AnketaQC -Recurse -File -Include *.dll,*.exe,*.pyd
          $files | ForEach-Object { Set-Content -Path $_.FullName -Stream Zone.Identifier -Value $zone }
          Write-Host "Marked $($files.Count) files"
          # Для справки: без снятия пометки и без .config (так было в версии 1.0.0)
          Rename-Item dist\AnketaQC\AnketaQC.exe.config AnketaQC.exe.config.off
          $env:ANKETA_QC_NO_UNBLOCK = "1"
          $old = Start-Process -FilePath "dist\AnketaQC\AnketaQC.exe" -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "Without the fix: exit code $($old.ExitCode) (expected non-zero)"
          Remove-Item Env:ANKETA_QC_NO_UNBLOCK
          Rename-Item dist\AnketaQC\AnketaQC.exe.config.off AnketaQC.exe.config
          $files | ForEach-Object { Set-Content -Path $_.FullName -Stream Zone.Identifier -Value $zone }
          $p = Start-Process -FilePath "dist\AnketaQC\AnketaQC.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "import anketa_qc; print(anketa_qc.__version__)"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          Compress-Archive -Path dist\AnketaQC -DestinationPath "dist\AnketaQC-portable-$version.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: AnketaQC-windows
          path: |
            qc_app/dist/AnketaQC-Setup-*.exe
            qc_app/dist/AnketaQC-portable-*.zip
