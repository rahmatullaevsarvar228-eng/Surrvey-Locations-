<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контроль качества анкет</title>
<link rel="stylesheet" href="/web/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/web/app.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="tb-brand">
      <div class="brand-mark small" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2.5l7.5 3v6c0 4.6-3.2 8.6-7.5 10-4.3-1.4-7.5-5.4-7.5-10v-6z"/><path class="tick" d="M8.3 12.2l2.6 2.6 4.9-5.2"/></svg>
      </div>
      <div class="tb-project">
        <select id="projectSelect" title="Проект"></select>
        <button class="icon-btn" id="newProjectBtn" title="Новый проект" aria-label="Новый проект">
          <svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg>
        </button>
      </div>
    </div>
    <nav id="nav" class="tabs">
      <a data-page="overview" class="needs-result">Сводка</a>
      <a data-page="daily" class="needs-result">По дням</a>
      <a data-page="interviewers" class="needs-result">Интервьюеры</a>
      <a data-page="defects" class="needs-result">Брак</a>
      <a data-page="map" class="needs-result">Карта</a>
      <a data-page="quotas" class="needs-result">Квоты</a>
      <a data-page="review" class="needs-result">Анкеты<span class="nav-badge" id="reviewBadge"></span></a>
    </nav>
    <div class="tb-right">
      <span class="tb-live" id="liveBox"></span>
      <button class="icon-btn big" id="runBtn" title="Забрать новые анкеты и проверить заново" aria-label="Обновить">
        <svg viewBox="0 0 20 20"><path d="M15.5 9a5.5 5.5 0 10-1.6 4.4M15.5 4.5V9H11"/></svg>
      </button>
      <button class="btn" id="wordBtn" disabled title="Отчёт в Word по текущим фильтрам">
        <svg viewBox="0 0 20 20"><path d="M5 2.5h7l3 3v12H5z"/><path d="M12 2.5v3h3M7.5 10l1 4 1.5-3 1.5 3 1-4"/></svg>
        Отчёт Word
      </button>
      <div class="menu-wrap">
        <button class="icon-btn big" id="moreBtn" title="Ещё" aria-label="Ещё" aria-haspopup="true">
          <svg viewBox="0 0 20 20"><circle cx="4.5" cy="10" r="1.3"/><circle cx="10" cy="10" r="1.3"/><circle cx="15.5" cy="10" r="1.3"/></svg>
        </button>
        <div class="menu-pop" id="morePop" hidden>
          <div class="menu-user" id="userBox"></div>
          <div class="menu-sep"></div>
          <button data-page="data">Источники данных</button>
          <button data-page="setup" class="lead-only">⚙ Настройка проверки</button>
          <div class="menu-sep"></div>
          <button id="exportBtn" disabled>Excel: полный отчёт</button>
          <button data-export="client" class="needs-result-btn">Excel: для заказчика</button>
          <button data-export="clean" class="needs-result-btn">Excel: чистая база</button>
          <button data-export="listen" class="needs-result-btn">Excel: на прослушку</button>
          <button data-export="cards" class="needs-result-btn">Word: карточки интервьюеров</button>
          <div class="menu-sep"></div>
          <button data-page="answers" class="needs-result-btn">Все ответы в открытых вопросах</button>
          <button data-page="repetition" class="needs-result-btn">Повтор значения у интервьюера</button>
          <button data-page="history">История по волнам</button>
          <div class="menu-sep admin-only"></div>
          <button data-page="admin" class="admin-only">Администрирование</button>
          <div class="menu-sep"></div>
          <button id="pwdBtn">Сменить пароль</button>
          <button id="logoutBtn">Выйти</button>
          <div class="menu-foot" id="sideFoot"></div>
        </div>
      </div>
    </div>
  </header>
  <main class="content" id="content"></main>
</div>

<div class="login-screen" id="loginScreen" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="brand-mark big" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2.5l7.5 3v6c0 4.6-3.2 8.6-7.5 10-4.3-1.4-7.5-5.4-7.5-10v-6z"/><path class="tick" d="M8.3 12.2l2.6 2.6 4.9-5.2"/></svg>
    </div>
    <h1>Контроль качества анкет</h1>
    <p class="muted">Войдите с логином, который выдал администратор</p>
    <div class="notice bad" id="loginError" hidden></div>
    <label class="field"><span>Логин</span><input type="text" id="loginName" autocomplete="username" required></label>
    <label class="field"><span>Пароль</span><input type="password" id="loginPass" autocomplete="current-password" required></label>
    <details id="serverBox">
      <summary>Адрес сервера</summary>
      <input type="url" id="loginServer" placeholder="https://script.google.com/macros/s/…/exec">
    </details>
    <button class="btn primary wide" type="submit" id="loginBtn">Войти</button>
    <div class="login-foot" id="loginFoot"></div>
  </form>
</div>

<div class="toast" id="toast" role="status"></div>
<div class="sheet-backdrop" id="modal" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <h2 id="modalTitle"></h2>
      <button class="icon-btn" id="modalClose" aria-label="Закрыть"><svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
    </div>
    <div class="sheet-body" id="modalBody"></div>
  </div>
</div>
<div class="busy" id="busy" hidden><div class="spinner"></div><div id="busyText">Проверяю анкеты…</div></div>

<script src="/web/vendor/leaflet/leaflet.js"></script>
<script src="/web/dash.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
